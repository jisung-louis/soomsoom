<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF7E8"/>
      <stop offset="0.52" stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#ECF7F0"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#FF7A59"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172033" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2 2L10 6L2 10" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="orangeArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2 2L10 6L2 10" stroke="#F97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.25"/>
    </pattern>
    <style>
      .title { font: 800 46px "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #172033; }
      .subtitle { font: 500 22px "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #64748B; }
      .section-title { font: 800 24px "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #172033; }
      .section-sub { font: 500 15px "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #64748B; }
      .label-white { font: 800 18px "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #FFFFFF; }
      .card-title { font: 800 18px "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #1E293B; }
      .card-small { font: 600 14px "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #64748B; }
      .chip { font: 700 13px "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #334155; }
      .note-title { font: 800 19px "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #172033; }
      .note { font: 600 15px "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #475569; }
