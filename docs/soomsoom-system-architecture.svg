    <text x="114" y="48" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="25" font-weight="800" fill="#172033">MySQL</text>
    <text x="114" y="75" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" font-weight="600" fill="#64748B">서비스 데이터 저장소</text>

    <rect x="40" y="116" width="96" height="34" rx="17" fill="#DBEAFE"/>
    <text x="88" y="138" text-anchor="middle" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" font-weight="700" fill="#334155">User Data</text>
    <rect x="154" y="116" width="96" height="34" rx="17" fill="#DBEAFE"/>
    <text x="202" y="138" text-anchor="middle" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" font-weight="700" fill="#334155">Emotion Log</text>
    <rect x="40" y="164" width="96" height="34" rx="17" fill="#DBEAFE"/>
    <text x="88" y="186" text-anchor="middle" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" font-weight="700" fill="#334155">Content Log</text>
    <rect x="154" y="164" width="96" height="34" rx="17" fill="#DBEAFE"/>
    <text x="202" y="186" text-anchor="middle" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" font-weight="700" fill="#334155">Reward Data</text>
  </g>

  <g transform="translate(1145 550)">
    <rect x="0" y="0" width="350" height="185" rx="30" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" filter="url(#softShadow)"/>
    <text x="28" y="43" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" font-weight="800" fill="#172033">Frontend 담당 관점</text>
    <text x="28" y="75" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" font-weight="600" fill="#64748B">화면 컴포넌트가 API/저장소를 직접 다루지 않도록</text>
    <text x="28" y="100" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" font-weight="600" fill="#64748B">Service, Hooks, Store 계층으로 책임을 분리</text>
    <text x="28" y="132" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" font-weight="600" fill="#64748B">서버 API와 로컬 상태를 연결해 앱 사용 흐름 구성</text>
  </g>

  <path d="M430 460H535" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="482" y="438" text-anchor="middle" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" font-weight="800" fill="#475569">REST API</text>
  <text x="482" y="485" text-anchor="middle" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" font-weight="600" fill="#64748B">Axios / JSON</text>

  <path d="M1035 430H1135" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1085" y="407" text-anchor="middle" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" font-weight="800" fill="#475569">Read / Write</text>

  <path d="M1035 610H1135" stroke="#CBD5E1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1085" y="588" text-anchor="middle" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" font-weight="600" fill="#64748B">구조 설명</text>
</svg>
