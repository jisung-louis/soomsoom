      <rect x="176" y="0" width="160" height="34" rx="17" fill="#DCFCE7"/>
      <text x="256" y="22" text-anchor="middle" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" font-weight="700" fill="#334155">Emotion Record</text>
      <rect x="0" y="48" width="160" height="34" rx="17" fill="#DCFCE7"/>
      <text x="80" y="70" text-anchor="middle" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" font-weight="700" fill="#334155">Content</text>
      <rect x="176" y="48" width="160" height="34" rx="17" fill="#DCFCE7"/>
      <text x="256" y="70" text-anchor="middle" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" font-weight="700" fill="#334155">Mission / Reward</text>
      <rect x="0" y="96" width="160" height="34" rx="17" fill="#DCFCE7"/>
      <text x="80" y="118" text-anchor="middle" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" font-weight="700" fill="#334155">Notification</text>
      <rect x="176" y="96" width="160" height="34" rx="17" fill="#DCFCE7"/>
      <text x="256" y="118" text-anchor="middle" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" font-weight="700" fill="#334155">Version Check</text>
    </g>

    <rect x="38" y="492" width="384" height="66" rx="22" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="2"/>
    <text x="64" y="523" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" font-weight="800" fill="#172033">Data Access Layer</text>
    <text x="64" y="548" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" font-weight="600" fill="#64748B">MySQL 데이터 조회/저장 및 도메인 데이터 영속화</text>
  </g>

  <g transform="translate(1205 255)">
